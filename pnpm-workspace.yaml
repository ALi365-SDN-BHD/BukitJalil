packages:
  - packages/shared
  - packages/server
  - packages/web
  - packages/desktop
minimumReleaseAgeExclude:
  - "@vitejs/plugin-react@6.3.0"
  - react-resizable-panels@4.21.0
  - "@earendil-works/pi-agent-core@1.5.1"
  - "@earendil-works/pi-ai@1.5.1"
  - "@earendil-works/pi-codemode@1.5.1"
  - "@earendil-works/pi-coding-agent@1.5.1"
  - "@earendil-works/pi-mcp@1.5.1"
  - "@earendil-works/pi-schema@1.5.1"
  - "@earendil-works/pi-telemetry@1.5.1"
  - "@earendil-works/pi-tui@1.5.1"

# Dependency install scripts are off unless listed (pnpm 12). esbuild's postinstall only verifies the
# platform binary, which pnpm already installs as an optional dependency.
allowBuilds:
  esbuild: false
  # Via Pi's model providers. genai's preinstall only echoes; protobufjs's postinstall only warns about
  # mismatched versions. Neither is needed.
  "@google/genai": false
  protobufjs: false
  # Via electron-builder: Squirrel.Windows installers, which BukitJalil does not build (NSIS instead).
  electron-winstaller: false
