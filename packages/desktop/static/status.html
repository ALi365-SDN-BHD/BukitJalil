<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>BukitJalil</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  main { max-width: 560px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  p { font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  pre { font-size: 12px; max-height: 240px; overflow: auto; padding: 12px; border-radius: 6px; background: rgba(127, 127, 127, 0.12); white-space: pre-wrap; word-break: break-all; }
  button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(127, 127, 127, 0.4); background: transparent; cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">BukitJalil</h1>
  <p id="text"></p>
  <pre id="detail" hidden></pre>
  <button id="restart" type="button" hidden></button>
</main>
<script src="status.js"></script>
</body>
</html>
