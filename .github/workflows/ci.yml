name: CI

on:
  push:
    branches: [main, pi-harness-ui]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the development version on both MVP platforms; 22.19.0 is the declared minimum (plan 2.1).
        # The Node 24 jobs build with the real Bukit; the minimum-Node job keeps the stand-in, whose scripted
        # failures some tests need.
        include:
          - { os: ubuntu-latest, node: "24", bukit: real }
          - { os: macos-latest, node: "24", bukit: real }
          - { os: ubuntu-latest, node: "22.19.0", bukit: stand-in }
    name: ${{ matrix.os }} / node ${{ matrix.node }} / ${{ matrix.bukit }} bukit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # pnpm only exists after `corepack enable`; the pnpm store is cached by the step below.
          package-manager-cache: false
      # The corepack bundled with Node 22.19.0 cannot install pnpm 12 (bin/pnpm.cjs not found), so every job
      # uses one pinned corepack. 0.34.6 runs pnpm 12 and still supports Node 22.11+; 0.36 needs 22.22.2.
      - name: Enable corepack (pnpm from packageManager)
        run: |
          npm install --global corepack@0.34.6
          corepack enable
          pnpm --version
      - name: Locate the pnpm store
        run: |
          store="$(pnpm store path --silent)"
          echo "PNPM_STORE=$store" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-node${{ matrix.node }}-
      - run: pnpm install --frozen-lockfile
      # The gate tests run the grep tool against a real rg when one is on PATH, and require it under CI.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get update && sudo apt-get install -y ripgrep; fi
          rg --version
      # Real Bukit 2.0.12 (plan M5 layer 4), fetched with the app's installer code (pinned SHA-256, strict
      # unpacking). With BUKIT_BIN and BUKIT_TARBALL set, the real-Bukit unit tests and the e2e tests use it.
      - name: Fetch Bukit
        if: matrix.bukit == 'real'
        run: |
          pnpm --filter @bukitjalil/server exec tsx scripts/fetch-bukit.ts "$RUNNER_TEMP/bukit" >> "$GITHUB_ENV"
      - name: Check Bukit
        if: matrix.bukit == 'real'
        run: |
          out="$("$BUKIT_BIN" version)"
          echo "$out"
          echo "$out" | grep -F "2.0.12"
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          retention-days: 7
